<script>
(function(){'use strict';
const names=['roster','lab','panel','branch'];const workspace=document.getElementById('workspace');const instances=new Map();const tabs=[...document.querySelectorAll('.tab')];
function getHTML(key){const source=document.getElementById('source-'+key);if(!source)throw Error('Module not found: '+key);const binary=atob(source.textContent.trim());const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function open(key){if(!names.includes(key))return;let view=instances.get(key);if(!view){view=document.createElement('section');view.className='view';view.setAttribute('aria-label',tabs.find(t=>t.dataset.module===key).textContent);const frame=document.createElement('iframe');frame.title=view.getAttribute('aria-label');frame.setAttribute('loading','eager');frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');view.append(frame);workspace.append(view);instances.set(key,view);try{frame.srcdoc=getHTML(key)}catch(error){view.textContent='Unable to load module: '+error.message;console.error(error)}}
for(const [name,section] of instances)section.classList.toggle('active',name===key);for(const tab of tabs){const selected=tab.dataset.module===key;tab.classList.toggle('selected',selected);tab.setAttribute('aria-selected',String(selected))}history.replaceState(null,'','#'+key)}
window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data||event.data.type!=='drprevents-sync-refresh')return;const key=event.data.module;if(!names.includes(key))return;const view=instances.get(key);if(!view)return;const frame=view.querySelector('iframe');if(event.source!==frame.contentWindow)return;frame.srcdoc=getHTML(key)});
for(const tab of tabs)tab.addEventListener('click',()=>open(tab.dataset.module));
function setTheme(theme){document.documentElement.className=theme==='light'?'light-theme':'dark-theme';document.getElementById('theme').textContent=theme==='light'?'Dark Mode':'Light Mode';try{localStorage.setItem('drprevents_master_theme',theme)}catch(e){}}
let saved='dark';try{saved=localStorage.getItem('drprevents_master_theme')||'dark'}catch(e){}setTheme(saved);document.getElementById('theme').addEventListener('click',()=>setTheme(document.documentElement.classList.contains('dark-theme')?'light':'dark'));
window.addEventListener('hashchange',()=>open(location.hash.slice(1)));open(names.includes(location.hash.slice(1))?location.hash.slice(1):'roster');
})();
</script></body></html>
